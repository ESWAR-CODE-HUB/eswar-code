<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRM Transport - Admin Portal</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --accent-glow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .portal-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2, h3 {
            text-align: center;
            margin-top: 0;
            letter-spacing: 1px;
        }

        .hidden { display: none !important; }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #818cf8;
            box-shadow: var(--accent-glow);
        }

        button {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: var(--accent-glow);
        }

        .btn-logout {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .section-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .msg {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        ul {
            list-style: none;
            padding: 0;
            max-height: 140px;
            overflow-y: auto;
            margin: 0;
        }

        li {
            background: rgba(15, 23, 42, 0.4);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
            border-left: 3px solid #818cf8;
        }

        .flex-row {
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>

<div class="portal-card">

    <!-- LOGIN SCREEN -->
    <div id="loginSection">
        <h2>Admin Portal Login</h2>
        <p style="text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px;">Restricted Access: Authorized Admin Only</p>
        
        <div class="form-group">
            <label for="adminEmail">Admin Email ID</label>
            <input type="email" id="adminEmail" placeholder="Enter your email...">
        </div>

        <div class="form-group">
            <label for="adminPass">Password</label>
            <input type="password" id="adminPass" placeholder="••••••••">
        </div>

        <button onclick="handleLogin()">Authenticate Login</button>
        <div id="loginMsg" class="msg" style="color: #f87171;"></div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardSection" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Transport Control Hub</h2>
            <span id="loggedUserEmail" style="font-size: 12px; color: #94a3b8; background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 6px;"></span>
        </div>

        <!-- 1. REGISTRATION SECTION -->
        <div class="section-box">
            <h3>Add Data to Database</h3>
            
            <div class="form-group">
                <label for="targetTable">Select Category</label>
                <select id="targetTable" onchange="switchFormFields()">
                    <option value="students">Student</option>
                    <option value="staffs">Staff</option>
                    <option value="drivers">Driver</option>
                </select>
            </div>

            <div class="form-group">
                <label id="labelField1" for="inputField1">Name</label>
                <input type="text" id="inputField1" placeholder="Enter name...">
            </div>

            <div class="form-group" id="groupField2">
                <label id="labelField2" for="inputField2">Roll Number / ID</label>
                <input type="text" id="inputField2" placeholder="Enter roll number / ID...">
            </div>

            <div class="form-group" id="groupField3">
                <label id="labelField3" for="inputField3">Assigned Bus ID</label>
                <input type="text" id="inputField3" placeholder="e.g. v1">
            </div>

            <button onclick="submitRecord()">Save Record</button>
            <div id="saveMsg" class="msg"></div>
        </div>

        <!-- 2. SEARCH RECORD SECTION -->
        <div class="section-box">
            <h3>Search Registration Status</h3>
            <div class="flex-row">
                <input type="text" id="searchQuery" placeholder="Enter Roll Number, ID, or Name...">
                <button style="width: 140px;" onclick="searchDatabase()">Search</button>
            </div>
            <div id="searchMsg" class="msg"></div>
        </div>

        <!-- 3. RECENT LIST SECTION -->
        <div class="section-box" style="margin-bottom: 0;">
            <h3>Recent Registrations</h3>
            <ul id="recentList">
                <li>Loading recent records...</li>
            </ul>
        </div>

        <button class="btn-logout" onclick="logoutAdmin()">Logout Session</button>
    </div>

</div>

<script>
    const SUPABASE_URL = "https://wsuicmqnpyqwzjaxhhzs.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzdWljbXFucHlxd3pqYXhoaHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDQwMzksImV4cCI6MjEwMTc4MDAzOX0.zAaBH1vEQ_4KlVDfDOnc1dvgPXPrFV46GSDv3Gn1Qxw";

    // REPLACE THIS WITH YOUR ACTUAL EMAIL ADDRESS THAT ONLY YOU SHOULD USE TO LOGIN
    const ADMIN_EMAIL = "venkatbhaigaming@gmail.com"; 

    window.onload = function() {
        let activeUser = sessionStorage.getItem("admin_email");
        if (activeUser === ADMIN_EMAIL) {
            showDashboard(activeUser);
        }
    };

    window.addEventListener("unload", function() {
        sessionStorage.removeItem("admin_email");
    });

    function handleLogin() {
        let email = document.getElementById('adminEmail').value.trim().toLowerCase();
        let pass = document.getElementById('adminPass').value.trim();
        let msg = document.getElementById('loginMsg');

        // Strictly matches your specific admin email address
        if (email === ADMIN_EMAIL.toLowerCase() && pass.length >= 6) {
            sessionStorage.setItem("admin_email", email);
            showDashboard(email);
        } else {
            msg.innerText = "Access Denied: Only the authorized admin email can log in.";
        }
    }

    function showDashboard(email) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('loggedUserEmail').innerText = email;
        loadRecentLogs();
    }

    function logoutAdmin() {
        sessionStorage.removeItem("admin_email");
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('adminEmail').value = '';
        document.getElementById('adminPass').value = '';
        document.getElementById('loginMsg').innerText = '';
    }

    function switchFormFields() {
        let table = document.getElementById('targetTable').value;
        let l1 = document.getElementById('labelField1');
        let l2 = document.getElementById('labelField2');
        let l3 = document.getElementById('labelField3');
        let g2 = document.getElementById('groupField2');
        let g3 = document.getElementById('groupField3');

        if (table === 'students') {
            l1.innerText = "Student Name";
            l2.innerText = "Roll Number";
            l3.innerText = "Assigned Bus ID";
            g2.style.display = 'block';
            g3.style.display = 'block';
        } else if (table === 'staffs') {
            l1.innerText = "Staff Name";
            l2.innerText = "Roll Number / ID";
            l3.innerText = "Assigned Bus ID";
            g2.style.display = 'block';
            g3.style.display = 'block';
        } else { // Drivers
            l1.innerText = "Driver Name";
            g2.style.display = 'none'; // Hides the ID input field completely for Drivers
            l3.innerText = "Assigned Bus ID";
            g3.style.display = 'block';
        }
    }

    async function submitRecord() {
        let table = document.getElementById('targetTable').value;
        let val1 = document.getElementById('inputField1').value.trim();
        let val2 = document.getElementById('inputField2').value.trim();
        let val3 = document.getElementById('inputField3').value.trim();
        let msg = document.getElementById('saveMsg');

        // Validation: Requires val2 ONLY if the table is NOT 'drivers'
        if (!val1 || !val3 || (table !== 'drivers' && !val2)) {
            msg.style.color = '#f87171';
            msg.innerText = "Please fill out all required fields!";
            return;
        }

        // Set payload dynamically based on category
        let payload;
        if (table === 'drivers') {
            payload = { name: val1, assigned_bus_id: val3 }; // No roll_number for drivers
        } else {
            payload = { name: val1, roll_number: val2, assigned_bus_id: val3 };
        }

        try {
            let res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                msg.style.color = '#4ade80';
                msg.innerText = "Record successfully saved to database!";
                document.getElementById('inputField1').value = '';
                document.getElementById('inputField2').value = '';
                document.getElementById('inputField3').value = '';
                loadRecentLogs();
            } else {
                let errText = await res.text();
                msg.style.color = '#f87171';
                msg.innerText = "Database error inserting record.";
                console.error(errText);
            }
        } catch (e) {
            msg.style.color = '#f87171';
            msg.innerText = "Network connection failed.";
        }
    }

    async function searchDatabase() {
        let query = document.getElementById('searchQuery').value.trim();
        let msg = document.getElementById('searchMsg');
        if (!query) {
            msg.style.color = '#f87171';
            msg.innerText = "Enter an ID or name to search.";
            return;
        }

        try {
            // Search students
            let resStud = await fetch(`${SUPABASE_URL}/rest/v1/students?or=(roll_number.eq.${query},name.ilike.*${query}*)&select=*`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });
            let dataStud = await resStud.json();
            if (dataStud.length > 0) {
                msg.style.color = '#4ade80';
                msg.innerText = `[STUDENT] Name: ${dataStud[0].name} | ID: ${dataStud[0].roll_number} | Bus: ${dataStud[0].assigned_bus_id}`;
                return;
            }

            // Search staffs
            let resStaff = await fetch(`${SUPABASE_URL}/rest/v1/staffs?or=(roll_number.eq.${query},name.ilike.*${query}*)&select=*`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });
            let dataStaff = await resStaff.json();
            if (dataStaff.length > 0) {
                msg.style.color = '#4ade80';
                msg.innerText = `[STAFF] Name: ${dataStaff[0].name} | ID: ${dataStaff[0].roll_number} | Bus: ${dataStaff[0].assigned_bus_id}`;
                return;
            }

            // Search drivers (Adjusted to not show ID if it doesn't exist)
            let resDriver = await fetch(`${SUPABASE_URL}/rest/v1/drivers?name=ilike.*${query}*&select=*`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });
            let dataDriver = await resDriver.json();
            if (dataDriver.length > 0) {
                msg.style.color = '#4ade80';
                msg.innerText = `[DRIVER] Name: ${dataDriver[0].name} | Bus: ${dataDriver[0].assigned_bus_id}`;
            } else {
                msg.style.color = '#fbbf24';
                msg.innerText = "Record not found in database.";
            }
        } catch (e) {
            msg.style.color = '#f87171';
            msg.innerText = "Error executing search query.";
        }
    }

    async function loadRecentLogs() {
        let listEl = document.getElementById('recentList');
        try {
            // Fetch from all three tables simultaneously
            let [resStud, resStaff, resDrive] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/students?select=*&order=created_at.desc&limit=3`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/staffs?select=*&order=created_at.desc&limit=3`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/drivers?select=*&order=created_at.desc&limit=3`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } })
            ]);

            // Helper to safely parse JSON and ignore errors (like missing columns)
            async function safeParse(res, tableName) {
                if (!res.ok) {
                    let err = await res.text();
                    console.error(`Error loading ${tableName}:`, err);
                    return [];
                }
                return await res.json();
            }

            let students = await safeParse(resStud, 'students');
            let staffs = await safeParse(resStaff, 'staffs');
            let drivers = await safeParse(resDrive, 'drivers');

            listEl.innerHTML = '';
            let combined = [];

            // Add records to the combined list (if they exist)
            if(Array.isArray(students)) students.forEach(s => combined.push({type: 'STUDENT', name: s.name, bus: s.assigned_bus_id, time: s.created_at || 0}));
            if(Array.isArray(staffs)) staffs.forEach(st => combined.push({type: 'STAFF', name: st.name, bus: st.assigned_bus_id, time: st.created_at || 0}));
            if(Array.isArray(drivers)) drivers.forEach(d => combined.push({type: 'DRIVER', name: d.name, bus: d.assigned_bus_id, time: d.created_at || 0}));

            // Sort the combined list so the absolute newest records across all tables show up first
            combined.sort((a, b) => new Date(b.time) - new Date(a.time));

            // Only keep the top 5 most recent across everything
            let topRecent = combined.slice(0, 5);

            if (topRecent.length === 0) {
                listEl.innerHTML = '<li>No recent records found (or check console for DB errors).</li>';
                return;
            }

            topRecent.forEach(item => {
                let li = document.createElement('li');
                li.innerText = `[${item.type}] ${item.name} (Bus: ${item.bus})`;
                listEl.appendChild(li);
            });
        } catch (e) {
            console.error("Network or script error:", e);
            listEl.innerHTML = '<li>Error loading recent feed. Check console (F12).</li>';
        }
    }
</script>

</body>
</html>
