<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRM Transport - Admin Portal</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --accent-glow: 0 0 20px rgba(99, 102, 241, 0.4);
            --danger-glow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .portal-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2, h3 {
            text-align: center;
            margin-top: 0;
            letter-spacing: 1px;
        }

        .hidden { display: none !important; }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #818cf8;
            box-shadow: var(--accent-glow);
        }

        button {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: var(--accent-glow);
        }

        .btn-logout {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .section-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .sos-box {
            border: 1px solid rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.05);
        }

        .msg {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        ul {
            list-style: none;
            padding: 0;
            max-height: 180px;
            overflow-y: auto;
            margin: 0;
        }

        li {
            background: rgba(15, 23, 42, 0.4);
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
            border-left: 3px solid #818cf8;
        }

        li.sos-item {
            border-left: 4px solid #ef4444;
            background: rgba(239, 68, 68, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn-sm-resolve {
            background: #22c55e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            width: auto;
            box-shadow: none;
        }

        .flex-row {
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>

<div class="portal-card">

    <!-- LOGIN SCREEN -->
    <div id="loginSection">
        <h2>Admin Portal Login</h2>
        <p style="text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px;">Restricted Access: Authorized Admin Only</p>
        
        <div class="form-group">
            <label for="adminEmail">Admin Email ID</label>
            <input type="email" id="adminEmail" placeholder="Enter your email...">
        </div>

        <div class="form-group">
            <label for="adminPass">Password</label>
            <input type="password" id="adminPass" placeholder="••••••••">
        </div>

        <button onclick="handleLogin()">Authenticate Login</button>
        <div id="loginMsg" class="msg" style="color: #f87171;"></div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardSection" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Transport Control Hub</h2>
            <span id="loggedUserEmail" style="font-size: 12px; color: #94a3b8; background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 6px;"></span>
        </div>

        <!-- 0. LIVE EMERGENCY & SOS FEED -->
        <div class="section-box sos-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin: 0; color: #f87171;">🚨 Live Driver SOS & Breakdown Alerts</h3>
                <button onclick="loadEmergencyAlerts()" style="width: auto; padding: 4px 10px; font-size: 11px; background: rgba(255,255,255,0.1);">Refresh</button>
            </div>
            <ul id="sosAlertsList">
                <li>Listening for emergency alerts...</li>
            </ul>
        </div>

        <!-- 1. REGISTRATION & MANAGEMENT SECTION -->
        <div class="section-box">
            <h3>Publish / Update Database</h3>
            
            <div class="form-group">
                <label for="targetTable">Select Category</label>
                <select id="targetTable" onchange="switchFormFields()">
                    <option value="notifications">Admin Notifications</option>
                    <option value="transport_department">Transport Dept / SOS Contacts</option>
                    <option value="students">Student</option>
                    <option value="staffs">Staff</option>
                    <option value="drivers">Driver</option>
                    <option value="route_stops">Route Stops</option>
                    <option value="quick_links">Campus Quick Links</option>
                </select>
            </div>

            <div class="form-group">
                <label id="labelField1" for="inputField1">Admin Announcement Message</label>
                <input type="text" id="inputField1" placeholder="Type notification message here...">
            </div>

            <div class="form-group" id="groupField2" style="display: none;">
                <label id="labelField2" for="inputField2">Secondary Field</label>
                <input type="text" id="inputField2" placeholder="">
            </div>

            <div class="form-group" id="groupField3" style="display: none;">
                <label id="labelField3" for="inputField3">Tertiary Field</label>
                <input type="text" id="inputField3" placeholder="">
            </div>

            <button onclick="submitRecord()">Save to Database</button>
            <div id="saveMsg" class="msg"></div>
        </div>

        <!-- 2. SEARCH RECORD SECTION -->
        <div class="section-box">
            <h3>Search Database</h3>
            <div class="flex-row">
                <input type="text" id="searchQuery" placeholder="Enter student roll number, driver name, or keyword...">
                <button style="width: 140px;" onclick="searchDatabase()">Search</button>
            </div>
            <div id="searchMsg" class="msg"></div>
        </div>

        <!-- 3. RECENT LOGS SECTION -->
        <div class="section-box" style="margin-bottom: 0;">
            <h3>Recent System Activity</h3>
            <ul id="recentList">
                <li>Loading recent records...</li>
            </ul>
        </div>

        <button class="btn-logout" onclick="logoutAdmin()">Logout Session</button>
    </div>

</div>

<script>
    const SUPABASE_URL = "https://wsuicmqnpyqwzjaxhhzs.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzdWljbXFucHlxd3pqYXhoaHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDQwMzksImV4cCI6MjEwMTc4MDAzOX0.zAaBH1vEQ_4KlVDfDOnc1dvgPXPrFV46GSDv3Gn1Qxw";

    const ADMIN_EMAIL = "venkatbhaigaming@gmail.com"; 

    let sosPollingInterval = null;

    window.onload = function() {
        let activeUser = sessionStorage.getItem("admin_email");
        if (activeUser === ADMIN_EMAIL) {
            showDashboard(activeUser);
        }
        switchFormFields();
    };

    window.addEventListener("unload", function() {
        sessionStorage.removeItem("admin_email");
        if (sosPollingInterval) clearInterval(sosPollingInterval);
    });

    function handleLogin() {
        let email = document.getElementById('adminEmail').value.trim().toLowerCase();
        let pass = document.getElementById('adminPass').value.trim();
        let msg = document.getElementById('loginMsg');

        if (email === ADMIN_EMAIL.toLowerCase() && pass.length >= 6) {
            sessionStorage.setItem("admin_email", email);
            showDashboard(email);
        } else {
            msg.innerText = "Access Denied: Only the authorized admin email can log in.";
        }
    }

    function showDashboard(email) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('loggedUserEmail').innerText = email;
        loadRecentLogs();
        loadEmergencyAlerts();

        if (!sosPollingInterval) {
            sosPollingInterval = setInterval(loadEmergencyAlerts, 10000);
        }
    }

    function logoutAdmin() {
        sessionStorage.removeItem("admin_email");
        if (sosPollingInterval) clearInterval(sosPollingInterval);
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('adminEmail').value = '';
        document.getElementById('adminPass').value = '';
        document.getElementById('loginMsg').innerText = '';
    }

    function switchFormFields() {
        let table = document.getElementById('targetTable').value;
        let l1 = document.getElementById('labelField1');
        let l2 = document.getElementById('labelField2');
        let l3 = document.getElementById('labelField3');
        let g2 = document.getElementById('groupField2');
        let g3 = document.getElementById('groupField3');

        if (table === 'notifications') {
            l1.innerText = "Admin Announcement Message";
            document.getElementById('inputField1').placeholder = "Enter campus announcement message...";
            g2.style.display = 'none';
            g3.style.display = 'none';
        } else if (table === 'transport_department') {
            l1.innerText = "Department Role / Office (e.g. Transport Control Room)";
            document.getElementById('inputField1').placeholder = "Enter role or office name...";
            l2.innerText = "Emergency Phone Number (e.g. 0863-2344444)";
            l3.innerText = "Contact Person Name (e.g. Duty Officer)";
            g2.style.display = 'block';
            g3.style.display = 'block';
        } else if (table === 'students') {
            l1.innerText = "Student Name";
            document.getElementById('inputField1').placeholder = "Enter student name...";
            l2.innerText = "Roll Number";
            l3.innerText = "Assigned Bus ID (e.g. v20)";
            g2.style.display = 'block';
            g3.style.display = 'block';
        } else if (table === 'staffs') {
            l1.innerText = "Staff Name";
            document.getElementById('inputField1').placeholder = "Enter staff name...";
            l2.innerText = "Roll Number / ID";
            l3.innerText = "Assigned Bus ID (e.g. v20)";
            g2.style.display = 'block';
            g3.style.display = 'block';
        } else if (table === 'drivers') {
            l1.innerText = "Driver Name";
            document.getElementById('inputField1').placeholder = "Enter driver name...";
            l2.innerText = "Login PIN (e.g. 2026)";
            l3.innerText = "Assigned Bus ID (e.g. v20)";
            g2.style.display = 'block';
            g3.style.display = 'block';
        } else if (table === 'route_stops') {
            l1.innerText = "Stop Description (e.g. Stop 1: Campus Main Gate)";
            document.getElementById('inputField1').placeholder = "Enter stop name...";
            l2.innerText = "Bus ID (e.g. v20)";
            g2.style.display = 'block';
            g3.style.display = 'none';
        } else if (table === 'quick_links') {
            l1.innerText = "Portal Title (e.g. SRM-AP Portal)";
            document.getElementById('inputField1').placeholder = "Enter portal name...";
            l2.innerText = "Destination URL (https://...)";
            g2.style.display = 'block';
            g3.style.display = 'none';
        }
    }

    async function submitRecord() {
        let table = document.getElementById('targetTable').value;
        let val1 = document.getElementById('inputField1').value.trim();
        let val2 = document.getElementById('inputField2').value.trim();
        let val3 = document.getElementById('inputField3').value.trim();
        let msg = document.getElementById('saveMsg');

        if (!val1 || (table === 'transport_department' && !val2) || (table === 'students' && (!val2 || !val3)) || (table === 'staffs' && (!val2 || !val3)) || (table === 'drivers' && (!val2 || !val3)) || (table === 'route_stops' && !val2) || (table === 'quick_links' && !val2)) {
            msg.style.color = '#f87171';
            msg.innerText = "Please fill out all required fields!";
            return;
        }

        let payload;
        if (table === 'notifications') {
            // Matches schema: columns 'message', 'created_at', 'id'
            payload = { message: val1 };
        } else if (table === 'transport_department') {
            payload = { department_role: val1, phone_number: val2, contact_person: val3 || 'In-Charge' };
        } else if (table === 'drivers') {
            payload = { name: val1, pin: val2, bus_id: val3.toLowerCase() };
        } else if (table === 'route_stops') {
            payload = { stop_name: val1, bus_id: val2.toLowerCase() };
        } else if (table === 'quick_links') {
            payload = { title: val1, url: val2 };
        } else {
            payload = { name: val1, roll_number: val2, assigned_bus_id: val3.toLowerCase() };
        }

        try {
            let res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                msg.style.color = '#4ade80';
                msg.innerText = "Record successfully saved to Supabase!";
                document.getElementById('inputField1').value = '';
                document.getElementById('inputField2').value = '';
                document.getElementById('inputField3').value = '';
                loadRecentLogs();
            } else {
                let errText = await res.text();
                msg.style.color = '#f87171';
                msg.innerText = "Database error: " + errText;
                console.error("Supabase Error:", errText);
            }
        } catch (e) {
            msg.style.color = '#f87171';
            msg.innerText = "Network connection failed.";
        }
    }

    async function loadEmergencyAlerts() {
        let sosListEl = document.getElementById('sosAlertsList');
        try {
            let res = await fetch(`${SUPABASE_URL}/rest/v1/emergency_alerts?order=created_at.desc&limit=5`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });

            if (res.ok) {
                let alerts = await res.json();
                sosListEl.innerHTML = '';

                if (!Array.isArray(alerts) || alerts.length === 0) {
                    sosListEl.innerHTML = '<li style="color: #4ade80; border-left: 3px solid #22c55e;">✅ All Clear: No active SOS or breakdown reports.</li>';
                    return;
                }

                alerts.forEach(item => {
                    let li = document.createElement('li');
                    li.className = 'sos-item';
                    let time = new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    let isResolved = item.status === 'RESOLVED';

                    li.innerHTML = `
                        <div>
                            <strong style="color: #f87171;">[BUS ${item.bus_id ? item.bus_id.toUpperCase() : 'UNKNOWN'}]</strong> 
                            <span>${item.emergency_type}</span>
                            <div style="font-size: 11px; color: #94a3b8; margin-top: 3px;">
                                Driver: <b>${item.driver_name || 'N/A'}</b> • ${time} • 
                                <a href="https://maps.google.com/?q=${item.latitude},${item.longitude}" target="_blank" style="color: #38bdf8; text-decoration: underline;">View Live GPS</a>
                            </div>
                        </div>
                        <div>
                            ${isResolved ? '<span style="color: #4ade80; font-size: 11px; font-weight: bold;">RESOLVED</span>' : `<button class="btn-sm-resolve" onclick="resolveEmergency(${item.id})">Mark Resolved</button>`}
                        </div>
                    `;
                    sosListEl.appendChild(li);
                });
            }
        } catch (e) {
            sosListEl.innerHTML = '<li>Unable to fetch SOS alerts.</li>';
        }
    }

    async function resolveEmergency(alertId) {
        try {
            let res = await fetch(`${SUPABASE_URL}/rest/v1/emergency_alerts?id=eq.${alertId}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                },
                body: JSON.stringify({ status: 'RESOLVED' })
            });

            if (res.ok) {
                loadEmergencyAlerts();
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function searchDatabase() {
        let query = document.getElementById('searchQuery').value.trim();
        let msg = document.getElementById('searchMsg');
        if (!query) {
            msg.style.color = '#f87171';
            msg.innerText = "Enter a keyword to search.";
            return;
        }

        try {
            let res = await fetch(`${SUPABASE_URL}/rest/v1/students?or=(roll_number.eq.${query},name.ilike.*${query}*)&select=*`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });
            let data = await res.json();
            if (data.length > 0) {
                msg.style.color = '#4ade80';
                msg.innerText = `[STUDENT] Name: ${data[0].name} | Bus: ${data[0].assigned_bus_id}`;
                return;
            }
            msg.style.color = '#fbbf24';
            msg.innerText = "Query processed. Check table records.";
        } catch (e) {
            msg.style.color = '#f87171';
            msg.innerText = "Error executing search query.";
        }
    }

    async function loadRecentLogs() {
        let listEl = document.getElementById('recentList');
        try {
            let [resNotes, resStops] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/notifications?select=*&limit=3`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/route_stops?select=*&limit=3`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } })
            ]);

            let notes = resNotes.ok ? await resNotes.json() : [];
            let stops = resStops.ok ? await resStops.json() : [];

            listEl.innerHTML = '';
            let combined = [];

            if(Array.isArray(notes)) notes.forEach(n => combined.push({type: 'NOTIFICATION', text: n.message}));
            if(Array.isArray(stops)) stops.forEach(s => combined.push({type: 'STOP', text: `${s.bus_id}: ${s.stop_name}`}));

            if (combined.length === 0) {
                listEl.innerHTML = '<li>No recent dynamic updates found.</li>';
                return;
            }

            combined.slice(0, 5).forEach(item => {
                let li = document.createElement('li');
                li.innerText = `[${item.type}] ${item.text}`;
                listEl.appendChild(li);
            });
        } catch (e) {
            listEl.innerHTML = '<li>Error loading feed.</li>';
        }
    }
</script>

</body>
</html>
